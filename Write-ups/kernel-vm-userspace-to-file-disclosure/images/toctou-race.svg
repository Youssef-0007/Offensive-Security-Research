<svg width="760" height="234" viewBox="0 0 760 234" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="race-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b2a4"/></marker></defs>
<text x="24" y="28" font-size="15" font-weight="600" fill="#111827">The client overwrites the byte between the check and the execute</text>
<g stroke="#b8b2a4" stroke-width="1.25" fill="none">
<path d="M260 150H280" marker-end="url(#race-arrow)"/>
<path d="M500 150H520" marker-end="url(#race-arrow)"/>
</g>
<rect x="40" y="122" width="220" height="56" rx="8" fill="none" stroke="#b8b2a4" stroke-width="1.25"/>
<text x="150" y="154" text-anchor="middle" fill="#111827" font-size="13">Validator checks the byte</text>
<rect x="280" y="122" width="220" height="56" rx="8" fill="#e7f0fe" stroke="#2563eb" stroke-width="2"/>
<text x="390" y="154" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">Client overwrites the byte</text>
<rect x="520" y="122" width="220" height="56" rx="8" fill="none" stroke="#b8b2a4" stroke-width="1.25"/>
<text x="630" y="154" text-anchor="middle" fill="#111827" font-size="13">Interpreter executes it</text>
<text x="390" y="210" text-anchor="middle" fill="#6b7280" font-size="11.5">same shared byte, read differently by each side</text>
</svg>
